name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Staged trusted publishing requires npm >= 11.15
      - run: npm install -g npm@latest
      # The trusted publisher is staging-only: a maintainer approves the
      # staged version on npmjs.com (or npm stage approve) to make it live.
      - run: npm stage publish
